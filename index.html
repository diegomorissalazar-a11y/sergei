<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SERGEI RUN</title>
  <link rel="icon" type="image/png" href="assets/icon-sergei-run.png" />
  <link rel="apple-touch-icon" href="assets/icon-sergei-run.png" />
  <meta name="theme-color" content="#F8FAFB" />

  <link rel="stylesheet" href="styles.css" />

  <!-- Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <main id="app">
    <section id="inicio" class="page active"></section>
    <section id="entrenamiento" class="page"></section>
    <section id="plan" class="page"></section>
    <section id="progreso" class="page"></section>
  </main>

  <div id="modal" class="modal hidden"></div>

  <nav class="tabbar">
    <button class="tab active" onclick="app.go('inicio', this)">
      <svg viewBox="0 0 24 24" class="icon">
        <path d="M3 10.5 12 3l9 7.5V21H3z"/>
        <path d="M9 21v-7h6v7"/>
      </svg>
      <span>Inicio</span>
    </button>

    <button class="tab" onclick="app.go('entrenamiento', this)">
      <svg viewBox="0 0 24 24" class="icon">
        <path d="M7 20l3-7 4 2 3-5"/>
        <path d="M12 6.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
        <path d="M10 9l-3 3"/>
        <path d="M14 15l3 5"/>
      </svg>
      <span>Entrenar</span>
    </button>

    <button class="tab" onclick="app.go('plan', this)">
      <svg viewBox="0 0 24 24" class="icon">
        <path d="M5 20V11"/>
        <path d="M12 20V7"/>
        <path d="M19 20V4"/>
      </svg>
      <span>Plan</span>
    </button>

    <button class="tab" onclick="app.go('progreso', this)">
      <svg viewBox="0 0 24 24" class="icon">
        <path d="M3 17c4-5 7-2 11-7 3-4 5-3 7-5"/>
        <circle cx="21" cy="5" r="1.8"/>
      </svg>
      <span>Progreso</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
