<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SERGEI RUN // V2.1</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F9FAFB;
      --card: #FFFFFF;
      --border: #E5E9E9;
      --text: #2C3333; /* Gris profundo de la imagen */
      --sub: #7A8686;
      --acc: #88C9C1; /* Verde menta del logo */
      --track: #F0F4F4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; padding-bottom: 90px; }
    
    /* HEADER CON LOGO */
    #hdr { position: sticky; top: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 10px 20px; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo-img { height: 40px; width: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
    .logo-txt { font-family: 'Oswald'; font-weight: 700; font-size: 18px; letter-spacing: 1px; color: var(--text); }
    .logo-txt span { color: var(--acc); }

    .container { max-width: 500px; margin: 0 auto; padding: 15px; }

    /* HERO & STATS */
    .hero { background: var(--text); color: white; padding: 25px 20px; border-radius: 16px; margin-bottom: 20px; position: relative; }
    .hero::after { content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100%; background: linear-gradient(to left, rgba(136,201,193,0.1), transparent); border-radius: 0 16px 16px 0; }
    .hero h2 { font-family: 'Oswald'; font-size: 24px; letter-spacing: 1px; }
    .days-big { font-family: 'Roboto Mono'; font-size: 44px; font-weight: 700; margin: 5px 0; color: var(--acc); }

    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .kpi-card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; }
    .kpi-val { display: block; font-family: 'Roboto Mono'; font-size: 20px; font-weight: 600; color: var(--text); }
    .kpi-lbl { font-size: 9px; color: var(--sub); text-transform: uppercase; font-family: 'Oswald'; letter-spacing: 1px; margin-top: 2px; }

    /* WEIGHT & PROGRESS */
    .prog-box { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 12px; margin-bottom: 15px; }
    .bar-bg { background: var(--track); height: 8px; border-radius: 4px; overflow: hidden; margin: 10px 0; }
    .bar-fill { background: var(--acc); height: 100%; transition: width 1s ease; }

    /* FORMULARIOS */
    .tabs { display: flex; background: var(--track); padding: 4px; border-radius: 10px; margin-bottom: 15px; }
    .tab { flex: 1; padding: 10px; border: none; border-radius: 7px; font-family: 'Oswald'; font-size: 11px; cursor: pointer; color: var(--sub); background: none; }
    .tab.active { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

    .form-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; }
    input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Roboto Mono'; font-size: 14px; margin-bottom: 12px; background: var(--bg); }
    
    .btn-main { background: var(--text); color: white; border: none; padding: 16px; border-radius: 8px; width: 100%; font-family: 'Oswald'; font-weight: 700; cursor: pointer; letter-spacing: 1px; }
    .btn-main span { color: var(--acc); }

    /* NAV */
    nav { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; border-top: 1px solid var(--border); height: 75px; box-shadow: 0 -5px 15px rgba(0,0,0,0.02); }
    nav button { flex: 1; border: none; background: none; color: var(--sub); font-family: 'Oswald'; font-size: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
    nav button.active { color: var(--text); }
    nav button.active svg { fill: var(--acc); }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="hdr">
    <div class="brand">
      <!-- Sustituye logo.png por la imagen que me pasaste -->
      <img src="logo.png" alt="S" class="logo-img">
      <div class="logo-txt">SERGEI<span>RUN</span></div>
    </div>
    <div style="font-family:'Roboto Mono'; font-size:9px; color:var(--acc)">V2.1_LIGHT</div>
  </div>

  <div class="container">
    
    <!-- INICIO -->
    <div id="view-home">
      <div class="hero">
        <h2 id="race-title">21K SANTIAGO</h2>
        <div class="days-big">42</div>
        <p style="font-size: 11px; opacity: 0.8; font-family: 'Roboto Mono'">DÍAS PARA LA META | META: 01:45:00</p>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card"><span class="kpi-val">08</span><span class="kpi-lbl">Semanas</span></div>
        <div class="kpi-card"><span class="kpi-val">114k</span><span class="kpi-lbl">Km Totales</span></div>
        <div class="kpi-card"><span class="kpi-val">95%</span><span class="kpi-lbl">Adherencia</span></div>
        <div class="kpi-card"><span class="kpi-val">78.2</span><span class="kpi-lbl">Peso Actual</span></div>
      </div>

      <div class="prog-box">
        <div style="display:flex; justify-content:space-between; font-family:'Oswald'; font-size:10px">
          <span style="color:var(--sub)">OBJETIVO DE PESO</span>
          <span>75.0 KG</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width: 70%"></div></div>
      </div>
    </div>

    <!-- PLAN -->
    <div id="view-plan" class="hidden">
      <div class="tabs">
        <button class="tab active">CARRERA</button>
        <button class="tab">FUERZA</button>
        <button class="tab">PESO</button>
      </div>

      <div class="form-card">
        <label style="font-family:'Oswald'; font-size:10px; color:var(--sub); margin-bottom:5px; display:block">DISTANCIA KM</label>
        <input type="number" step="0.1" placeholder="0.0">
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
          <div>
            <label style="font-family:'Oswald'; font-size:10px; color:var(--sub)">TIEMPO MIN</label>
            <input type="number">
          </div>
          <div>
            <label style="font-family:'Oswald'; font-size:10px; color:var(--sub)">RITMO</label>
            <input type="text" readonly placeholder="0:00" style="background:var(--track)">
          </div>
        </div>
        
        <button class="btn-main">REGISTRAR <span>ENTRENAMIENTO</span></button>
      </div>
    </div>

    <!-- STATS -->
    <div id="view-stats" class="hidden">
      <div class="prog-box">
        <span class="kpi-lbl">VOLUMEN SEMANAL</span>
        <div style="display:flex; align-items:flex-end; height:100px; gap:8px; margin-top:15px">
            <div style="flex:1; background:var(--track); height:30%"></div>
            <div style="flex:1; background:var(--acc); height:60%"></div>
            <div style="flex:1; background:var(--text); height:85%"></div>
            <div style="flex:1; background:var(--acc); height:70%"></div>
        </div>
      </div>
      
      <div class="kpi-card" style="margin-bottom:10px">
        <span class="kpi-lbl">RÉCORD 10K</span>
        <span class="kpi-val">47:22</span>
      </div>
      
      <button class="btn-main" style="background:none; border:1px solid var(--border); color:var(--text)" onclick="alert('Exportando...')">EXPORTAR HISTORIAL CSV</button>
    </div>

  </div>

  <nav>
    <button onclick="show('view-home')" id="n-home" class="active">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      INICIO
    </button>
    <button onclick="show('view-plan')" id="n-plan">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      PLAN
    </button>
    <button onclick="show('view-stats')" id="n-stats">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
      STATS
    </button>
  </nav>

  <script>
    function show(id) {
      document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('n-' + id.split('-')[1]).classList.add('active');
    }
  </script>
</body>
</html>
