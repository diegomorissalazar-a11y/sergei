<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERGEI RUN</title>

<style>
:root {
--bg:#F8FAFB;
--primary:#1E3A52;
--accent:#6ECFBA;
--blue:#4A7FA5;
--card:#ffffff;
}

body {
margin:0;
font-family: system-ui;
background:var(--bg);
}

/* NAV */
nav {
position:fixed;
bottom:0;
width:100%;
display:flex;
background:white;
border-top:1px solid #eee;
}

nav button {
flex:1;
padding:12px;
border:none;
background:none;
}

/* PAGE */
.page {
display:none;
padding:16px;
padding-bottom:80px;
}

.page.active { display:block; }

/* CARD */
.card {
background:white;
border-radius:14px;
padding:16px;
margin-bottom:16px;
box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

/* PLAN */
.plan-card {
border:1px solid #eee;
border-radius:12px;
padding:14px;
margin-bottom:10px;
}

.plan-day {
font-size:12px;
color:var(--accent);
font-weight:bold;
}

.plan-km {
font-size:42px;
font-weight:bold;
color:var(--primary);
}

/* MODAL */
.modal {
position:fixed;
bottom:0;
width:100%;
background:white;
border-radius:20px 20px 0 0;
padding:20px;
}

.hidden { display:none; }

</style>
</head>

<body>

<!-- INICIO -->
<div id="inicio" class="page active">

<div class="card">
<div id="today"></div>
<h2>Hola, Diego 👋</h2>
</div>

<div class="card">
<div>ADHERENCIA</div>
<h1 id="adherence">0%</h1>
</div>

<div class="card">
<div>PESO</div>
<h2 id="weight">--</h2>
<button onclick="app.openWeight()">+ Peso</button>
</div>

<div class="card">
<div>ÚLTIMOS ENTRENAMIENTOS</div>
<div id="lastSessions"></div>
</div>

</div>

<!-- PLAN -->
<div id="plan" class="page">

<div class="card">
<h3>PLAN SEMANAL</h3>
<div id="planList"></div>
</div>

</div>

<!-- PROGRESO -->
<div id="progreso" class="page">

<div class="card">
<h3>PESO</h3>
<div id="weightHistory"></div>
</div>

</div>

<!-- ENTRENAMIENTO -->
<div id="entreno" class="page">

<div class="card">
<h3>Registrar</h3>
<input id="km" placeholder="km">
<input id="time" placeholder="min">
<button onclick="app.saveSession()">Guardar</button>
</div>

</div>

<!-- NAV -->
<nav>
<button onclick="app.go('inicio')">Inicio</button>
<button onclick="app.go('plan')">Plan</button>
<button onclick="app.go('progreso')">Progreso</button>
<button onclick="app.go('entreno')">Entreno</button>
</nav>

<script>
const app = {

db: {
weights: JSON.parse(localStorage.getItem("w"))||[],
sessions: JSON.parse(localStorage.getItem("s"))||[],
plans: JSON.parse(localStorage.getItem("p"))||[]
},

init(){
this.setToday();
this.ensurePlan();
this.render();
},

go(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
},

setToday(){
document.getElementById("today").innerText =
new Date().toLocaleDateString("es-CL",{weekday:"long", day:"numeric", month:"long"});
},

/* PLAN */
ensurePlan(){
if(this.db.plans.length) return;

this.db.plans.push({
days:[
{day:"Lunes",planned:true,km:5},
{day:"Martes",planned:true,km:3},
{day:"Miércoles",planned:false},
{day:"Jueves",planned:true,km:7},
{day:"Viernes",planned:false},
{day:"Sábado",planned:true,km:5},
{day:"Domingo",planned:true,km:10}
]
});

this.save();
},

renderPlan(){
const el = document.getElementById("planList");
el.innerHTML="";

this.db.plans[0].days.forEach(d=>{
if(!d.planned) return;

let done = this.db.sessions.find(s=>s.day===d.day);

el.innerHTML+=`
<div class="plan-card">
<div class="plan-day">${d.day}</div>
<div class="plan-km">${d.km}</div>
<div>${done?"✔":"○"}</div>
</div>`;
});
},

/* PESO */
openWeight(){
let val = prompt("Peso:");
if(!val) return;

this.db.weights.push({val:parseFloat(val),date:new Date()});
this.save();
this.render();
},

/* SESIONES */
saveSession(){
let km = document.getElementById("km").value;
let time = document.getElementById("time").value;

this.db.sessions.push({
km:parseFloat(km),
time:parseFloat(time),
date:new Date(),
day:new Date().toLocaleDateString("es-CL",{weekday:"long"})
});

this.save();
this.render();
},

/* KPIs */
adherence(){
let plan = this.db.plans[0].days.filter(d=>d.planned).length;
let done = this.db.sessions.length;
return Math.round(done/plan*100);
},

/* RENDER */
render(){

document.getElementById("weight").innerText =
this.db.weights.length ? this.db.weights.slice(-1)[0].val+" kg" : "--";

document.getElementById("adherence").innerText =
this.adherence()+"%";

this.renderPlan();

},

save(){
localStorage.setItem("w",JSON.stringify(this.db.weights));
localStorage.setItem("s",JSON.stringify(this.db.sessions));
localStorage.setItem("p",JSON.stringify(this.db.plans));
}

};

window.onload=()=>app.init();
</script>

</body>
</html>
