<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SERGEI RUN</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main id="app">
    <section id="inicio" class="page active"></section>
    <section id="entrenamiento" class="page"></section>
    <section id="plan" class="page"></section>
    <section id="progreso" class="page"></section>
  </main>

  <div id="modal" class="modal hidden"></div>

  <nav class="tabbar">
    <button class="tab active" onclick="app.go('inicio', this)">
      <svg viewBox="0 0 24 24" class="icon">
        <path d="M3 10.5 12 3l9 7.5V21H3z"/>
        <path d="M9 21v-7h6v7"/>
      </svg>
      <span>Inicio</span>
    </button>

    <button class="tab" onclick="app.go('entrenamiento', this)">
      <svg viewBox="0 0 24 24" class="icon">
        <path d="M6 20 10 13l3 2 2 5"/>
        <path d="M10 13l3-4 4 2"/>
        <circle cx="15.5" cy="5.5" r="2"/>
      </svg>
      <span>Entrenar</span>
    </button>

    <button class="tab" onclick="app.go('plan', this)">
      <svg viewBox="0 0 24 24" class="icon">
        <path d="M5 20V12"/>
        <path d="M12 20V8"/>
        <path d="M19 20V4"/>
      </svg>
      <span>Plan</span>
    </button>

    <button class="tab" onclick="app.go('progreso', this)">
      <svg viewBox="0 0 24 24" class="icon">
        <path d="M3 17c4-5 7-2 11-7 3-4 5-3 7-5"/>
        <circle cx="21" cy="5" r="1.8"/>
      </svg>
      <span>Progreso</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
