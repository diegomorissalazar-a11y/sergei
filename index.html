<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERGEI RUN</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="app">

<section id="inicio" class="page active"></section>
<section id="plan" class="page"></section>
<section id="progreso" class="page"></section>
<section id="entrenamiento" class="page"></section>

</div>

<div id="weightModal" class="modal hidden"></div>

<nav class="tabbar">

<button class="tab active" onclick="app.go('inicio', this)">
<svg viewBox="0 0 24 24" class="icon">
<path d="M3 10L12 3L21 10V20H3Z"/>
<path d="M9 21V12H15V21"/>
</svg>
<span>Inicio</span>
</button>

<button class="tab" onclick="app.go('entrenamiento', this)">
<svg viewBox="0 0 24 24" class="icon">
<path d="M4 20C6 14 10 12 14 12"/>
<path d="M14 12C16 11 18 9 18 6"/>
<circle cx="16" cy="6" r="2"/>
</svg>
<span>Entreno</span>
</button>

<button class="tab" onclick="app.go('plan', this)">
<svg viewBox="0 0 24 24" class="icon">
<rect x="4" y="10" width="3" height="10"/>
<rect x="10" y="6" width="3" height="14"/>
<rect x="16" y="3" width="3" height="17"/>
</svg>
<span>Plan</span>
</button>

<button class="tab" onclick="app.go('progreso', this)">
<svg viewBox="0 0 24 24" class="icon">
<path d="M3 17C7 13 10 14 14 10C17 7 19 7 21 5"/>
<circle cx="21" cy="5" r="1.5"/>
</svg>
<span>Progreso</span>
</button>

</nav>

<script src="app.js"></script>

</body>
</html>
