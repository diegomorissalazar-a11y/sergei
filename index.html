<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERGEI - Training Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto+Mono&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bk: #0F1212; --g9: #1A1E1E; --g8: #242929; --g7: #2C3333;
            --wh: #E6E9E9; --acc: #C5D1D1; --green: #4CAF50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bk); color: var(--wh); font-family: 'Roboto', sans-serif; padding-bottom: 80px; }
        
        #hdr { position: sticky; top: 0; background: rgba(15,18,18,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--g7); padding: 15px; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Oswald'; letter-spacing: 3px; font-weight: 700; }

        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }
        
        .card { background: var(--g8); border: 1px solid var(--g7); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .clbl { font-family: 'Oswald'; font-size: 11px; letter-spacing: 1px; color: #8E9B9B; text-transform: uppercase; margin-bottom: 10px; }

        /* FORMULARIO CARGA */
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 12px; margin-bottom: 4px; color: var(--acc); }
        input, select { width: 100%; background: var(--bk); border: 1px solid var(--g7); color: white; padding: 10px; border-radius: 5px; font-family: 'Roboto Mono'; }
        
        /* LISTADO DE SESIONES */
        .session-item { display: flex; align-items: center; background: var(--g9); border: 1px solid var(--g7); padding: 12px; border-radius: 6px; margin-bottom: 8px; gap: 12px; transition: 0.3s; }
        .session-item.done { border-color: var(--green); opacity: 0.7; }
        .session-info { flex-grow: 1; }
        .session-date { font-size: 10px; color: var(--acc); font-family: 'Roboto Mono'; }
        .session-desc { font-family: 'Oswald'; font-size: 16px; }
        .check-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--g7); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: transparent; }
        .done .check-btn { background: var(--green); border-color: var(--green); color: white; }

        /* BOTONES */
        .btn { width: 100%; padding: 12px; border-radius: 6px; border: none; font-family: 'Oswald'; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 5px; }
        .btn-primary { background: var(--wh); color: var(--bk); }
        .btn-outline { background: transparent; border: 1px solid var(--g7); color: var(--wh); margin-top: 20px; }

        nav { position: fixed; bottom: 0; width: 100%; background: var(--g9); display: flex; border-top: 1px solid var(--g7); }
        nav button { flex: 1; padding: 15px; background: none; border: none; color: #5E6B6B; font-family: 'Oswald'; cursor: pointer; }
        nav button.active { color: var(--wh); border-top: 2px solid var(--wh); }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="hdr">
        <div class="logo">SERGEI // S01</div>
        <div id="week-label" style="font-family: 'Roboto Mono'; font-size: 12px;">PROGRESO</div>
    </div>

    <div class="container">
        
        <!-- VISTA: PLANIFICAR -->
        <div id="view-plan" class="hidden">
            <div class="card">
                <div class="clbl">Nueva Planificación Semanal</div>
                <div class="input-group">
                    <label>Lunes de la semana:</label>
                    <input type="date" id="plan-monday">
                </div>
                <hr style="border:0; border-top:1px solid var(--g7); margin:15px 0;">
                <div id="sessions-inputs">
                    <!-- Aquí se podrían agregar más inputs dinámicamente, por ahora fijo 4 -->
                    <div class="input-group">
                        <label>Sesión 1 (Día y Km):</label>
                        <div style="display:flex; gap:5px;">
                            <select id="d1"><option>Martes</option><option>Jueves</option><option>Sábado</option><option>Domingo</option></select>
                            <input type="number" id="k1" placeholder="Km">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Sesión 2 (Día y Km):</label>
                        <div style="display:flex; gap:5px;">
                            <select id="d2"><option>Jueves</option><option>Martes</option><option>Sábado</option><option>Domingo</option></select>
                            <input type="number" id="k2" placeholder="Km">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Sesión 3 (Día y Km):</label>
                        <div style="display:flex; gap:5px;">
                            <select id="d3"><option>Sábado</option><option>Martes</option><option>Jueves</option><option>Domingo</option></select>
                            <input type="number" id="k3" placeholder="Km">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Sesión 4 (Día y Km):</label>
                        <div style="display:flex; gap:5px;">
                            <select id="d4"><option>Domingo</option><option>Martes</option><option>Jueves</option><option>Sábado</option></select>
                            <input type="number" id="k4" placeholder="Km">
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="savePlan()">Cargar Semana</button>
            </div>
        </div>

        <!-- VISTA: EJECUCIÓN -->
        <div id="view-track">
            <div class="clbl">Pendientes / Esta Semana</div>
            <div id="list-pending"></div>
            
            <div class="clbl" style="margin-top:20px;">Completados</div>
            <div id="list-completed"></div>

            <button class="btn btn-outline" onclick="downloadCSV()">Descargar CSV de Progreso</button>
        </div>

    </div>

    <nav>
        <button id="btn-v-track" class="active" onclick="showView('track')">PROGRESO</button>
        <button id="btn-v-plan" onclick="showView('plan')">PLANIFICAR</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('sergei_db')) || [];

        function showView(view) {
            document.getElementById('view-plan').classList.toggle('hidden', view !== 'plan');
            document.getElementById('view-track').classList.toggle('hidden', view !== 'track');
            document.getElementById('btn-v-plan').classList.toggle('active', view === 'plan');
            document.getElementById('btn-v-track').classList.toggle('active', view === 'track');
            if(view === 'track') renderList();
        }

        function savePlan() {
            const monday = document.getElementById('plan-monday').value;
            if(!monday) return alert("Selecciona el lunes de inicio");

            for(let i=1; i<=4; i++) {
                const day = document.getElementById(`d${i}`).value;
                const km = document.getElementById(`k${i}`).value;
                if(km) {
                    db.push({
                        id: Date.now() + i,
                        monday: monday,
                        day: day,
                        planned_km: km,
                        actual_km: 0,
                        done: false
                    });
                }
            }
            localStorage.setItem('sergei_db', JSON.stringify(db));
            alert("Plan cargado exitosamente");
            showView('track');
        }

        function toggleTask(id) {
            const item = db.find(x => x.id === id);
            item.done = !item.done;
            item.actual_km = item.done ? item.planned_km : 0;
            localStorage.setItem('sergei_db', JSON.stringify(db));
            renderList();
        }

        function renderList() {
            const pendingDiv = document.getElementById('list-pending');
            const doneDiv = document.getElementById('list-completed');
            pendingDiv.innerHTML = '';
            doneDiv.innerHTML = '';

            // Ordenar por fecha de lunes
            db.sort((a,b) => new Date(b.monday) - new Date(a.monday));

            db.forEach(item => {
                const html = `
                    <div class="session-item ${item.done ? 'done' : ''}" onclick="toggleTask(${item.id})">
                        <div class="check-btn">✓</div>
                        <div class="session-info">
                            <div class="session-date">Semana: ${item.monday} | ${item.day}</div>
                            <div class="session-desc">${item.planned_km} KM</div>
                        </div>
                    </div>
                `;
                if(item.done) doneDiv.innerHTML += html;
                else pendingDiv.innerHTML += html;
            });
        }

        function downloadCSV() {
            let csv = "Lunes_Semana,Dia,Km_Planificado,Km_Real,Completado\n";
            db.forEach(item => {
                csv += `${item.monday},${item.day},${item.planned_km},${item.actual_km},${item.done}\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `progreso_sergei_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Inicializar
        renderList();
    </script>
</body>
</html>
