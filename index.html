<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERGEI RUN</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#F8FAFB;
    margin:0;
}

/* ===== HEADER ===== */
header {
    padding:16px;
    background:white;
    border-bottom:1px solid #eee;
}

h1 { margin:0; font-size:24px; }

/* ===== CARDS ===== */
.card {
    background:white;
    margin:16px;
    padding:16px;
    border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

/* ===== PLAN ===== */
.plan-card {
    border:1px solid #eee;
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
}

.plan-day {
    color:#6ECFBA;
    font-size:12px;
    font-weight:bold;
}

.plan-km {
    font-size:40px;
    font-weight:bold;
    color:#1E3A52;
}

.plan-status {
    margin-top:8px;
    font-size:12px;
}

.plan-diff.pos { color:green; }
.plan-diff.neg { color:red; }

/* ===== MODAL ===== */
.modal {
    position:fixed;
    bottom:0;
    width:100%;
    background:white;
    border-radius:20px 20px 0 0;
    padding:20px;
}

.hidden { display:none; }

.picker {
    height:120px;
    overflow:auto;
    text-align:center;
}

button {
    padding:10px;
    margin-top:10px;
    width:100%;
}
</style>
</head>

<body>

<header>
    <div>Hola, Diego 👋</div>
</header>

<div class="card">
    <h3>Adherencia semanal</h3>
    <div id="adherence">0%</div>
</div>

<div class="card">
    <h3>Peso</h3>
    <div id="weight">--</div>
    <button onclick="sergei.openWeightModal()">+ Peso</button>
</div>

<div class="card">
    <h3>Plan semanal</h3>
    <div id="plan"></div>
</div>

<div class="card">
    <button onclick="sergei.exportCSV()">Export CSV</button>
</div>

<!-- MODAL -->
<div id="weight-modal" class="modal hidden">
    <div id="kg"></div>
    <div id="dec"></div>
    <button onclick="sergei.saveWeight()">Guardar</button>
</div>

<script>
const USE_FIREBASE = false;

const sergei = {

db: {
    weights: JSON.parse(localStorage.getItem("weights")) || [],
    sessions: JSON.parse(localStorage.getItem("sessions")) || [],
    plans: JSON.parse(localStorage.getItem("plans")) || []
},

init() {
    this.ensureWeek();
    this.render();
},

/* ===== PLAN ===== */
getWeekId() {
    const d = new Date();
    return d.getFullYear() + "-W" + Math.ceil(d.getDate()/7);
},

ensureWeek() {
    const id = this.getWeekId();
    let week = this.db.plans.find(p => p.id === id);

    if (!week) {
        week = {
            id,
            days: [
                {day:"Lunes", planned:true, km:5},
                {day:"Martes", planned:true, km:3},
                {day:"Miércoles", planned:false},
                {day:"Jueves", planned:true, km:7},
                {day:"Viernes", planned:false},
                {day:"Sábado", planned:true, km:5},
                {day:"Domingo", planned:true, km:10}
            ]
        };
        this.db.plans.push(week);
        this.save();
    }
},

renderPlan() {
    const container = document.getElementById("plan");
    container.innerHTML = "";

    const week = this.db.plans[0];

    week.days.forEach(d => {
        if (!d.planned) return;

        const el = document.createElement("div");
        el.className = "plan-card";

        const session = this.db.sessions.find(s => s.day === d.day);
        let diff = "";

        if (session) {
            const dif = session.km - d.km;
            diff = `<div class="plan-diff ${dif>=0?'pos':'neg'}">${dif} km</div>`;
        }

        el.innerHTML = `
            <div class="plan-day">${d.day}</div>
            <div class="plan-km">${d.km}</div>
            <div class="plan-status">${session ? "✔" : "○"}</div>
            ${diff}
        `;

        container.appendChild(el);
    });
},

/* ===== PESO ===== */
openWeightModal() {
    document.getElementById("weight-modal").classList.remove("hidden");
},

saveWeight() {
    const val = prompt("Peso:");
    if (!val) return;

    this.db.weights.push({
        date:new Date().toISOString(),
        val:parseFloat(val)
    });

    this.save();
    this.render();
},

/* ===== ADHERENCIA ===== */
getAdherence() {
    const week = this.db.plans[0];

    const planned = week.days.filter(d=>d.planned).length;
    const done = this.db.sessions.length;

    return Math.round((done/planned)*100);
},

/* ===== EXPORT ===== */
exportCSV() {
    let csv = "TIPO,FECHA,KM\n";

    this.db.sessions.forEach(s=>{
        csv += `RUN,${s.date},${s.km}\n`;
    });

    csv += "\nPESO\n";

    this.db.weights.forEach(w=>{
        csv += `${w.date},${w.val}\n`;
    });

    navigator.clipboard.writeText(csv);
    alert("copiado");
},

save() {
    localStorage.setItem("weights", JSON.stringify(this.db.weights));
    localStorage.setItem("sessions", JSON.stringify(this.db.sessions));
    localStorage.setItem("plans", JSON.stringify(this.db.plans));
},

render() {
    document.getElementById("weight").innerText =
        this.db.weights.length ? this.db.weights.slice(-1)[0].val : "--";

    document.getElementById("adherence").innerText =
        this.getAdherence() + "%";

    this.renderPlan();
}

};

window.onload = () => sergei.init();
</script>

</body>
</html>
