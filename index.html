<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SERGEI v2.0 - Performance Engine</title>
    <!-- Identidad Visual y Tipografías -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto+Mono&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bk: #0c0c0c; --g8: #1a1a1a; --g7: #232323; --g6: #303030; --g4: #707070; --wh: #f5f5f5;
            --accent: #ffffff; --fd: 'Oswald', sans-serif; --fm: 'Roboto Mono', monospace;
            --z1: #3a3a3a; --z2: #4a90e2; --z3: #50e3c2; --z4: #f5a623; --z5: #d0021b;
            --safe-bottom: env(safe-area-inset-bottom);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bk); 
            color: var(--wh); 
            font-family: 'Roboto', sans-serif; 
            padding-bottom: calc(90px + var(--safe-bottom)); 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Header & Branding */
        #hdr { 
            position: sticky; top: 0; z-index: 1000; 
            background: rgba(12,12,12,0.95); 
            backdrop-filter: blur(15px); 
            border-bottom: 1px solid var(--g7); 
            display: flex; align-items: center; 
            padding: 0 20px; height: 75px; gap: 15px; 
        }
        
        .logo-face { width: 48px; height: 48px; flex-shrink: 0; }
        .ltw .ln { font-family: var(--fd); font-weight: 700; font-size: 26px; letter-spacing: 3px; line-height: 1; }
        .ltw .ls { font-family: var(--fm); font-size: 9px; color: var(--g4); letter-spacing: 1px; margin-top: 2px; }

        /* Sistema de Navegación de 4 Secciones */
        #nav { 
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; 
            background: rgba(12,12,12,0.98); 
            border-top: 1px solid var(--g7); 
            display: flex; height: calc(75px + var(--safe-bottom)); 
            padding-bottom: var(--safe-bottom);
        }
        
        .nb { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: none; border: none; color: var(--g4); cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            border-top: 3px solid transparent; 
        }
        
        .nb.on { color: var(--wh); border-top-color: var(--wh); background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent); }
        .nb i { font-size: 24px; margin-bottom: 5px; font-style: normal; }
        .nb span { font-family: var(--fd); font-size: 11px; letter-spacing: 1px; font-weight: 700; }

        /* Arquitectura de Vistas */
        .page { display: none; padding: 25px 20px; max-width: 650px; margin: 0 auto; min-height: 100vh; }
        .page.on { display: block; animation: vFade 0.4s cubic-bezier(0.23, 1, 0.32, 1); }
        
        @keyframes vFade { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Componentes de UI de Alto Nivel */
        .card { background: var(--g8); border: 1px solid var(--g7); border-radius: 16px; padding: 24px; margin-bottom: 25px; transition: 0.3s; }
        .hero { 
            background: linear-gradient(145deg, #1a1a1a 0%, #050505 100%); 
            border: 1px solid var(--g6); border-radius: 20px; padding: 35px; 
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .hero-num { font-family: var(--fm); font-size: 60px; font-weight: 700; color: var(--wh); line-height: 0.9; letter-spacing: -2px; }
        
        /* Formulario y Controles */
        .input-group { margin-bottom: 20px; }
        label { display: block; font-family: var(--fd); font-size: 12px; color: var(--g4); letter-spacing: 1.5px; margin-bottom: 8px; text-transform: uppercase; }
        
        input, select, textarea { 
            width: 100%; background: var(--g7); border: 1px solid var(--g6); color: #fff; 
            padding: 16px; border-radius: 10px; font-family: var(--fm); font-size: 15px; 
            outline: none; transition: 0.3s; 
        }
        
        input:focus { border-color: var(--wh); background: var(--g6); }
        
        .btn { 
            background: var(--wh); color: var(--bk); border: none; padding: 20px; 
            border-radius: 12px; width: 100%; font-family: var(--fd); font-weight: 700; 
            font-size: 15px; cursor: pointer; margin-top: 15px; text-transform: uppercase; 
            transition: all 0.3s; letter-spacing: 1px;
        }
        
        .btn:active { transform: scale(0.97); filter: brightness(0.9); }
        .btn-ghost { background: transparent; color: var(--wh); border: 1px solid var(--g6); }

        /* Gráficos de Rendimiento SVG */
        .chart-box { width: 100%; height: 220px; margin-top: 25px; border-top: 1px solid var(--g7); padding-top: 20px; position: relative; }
        .bar { fill: rgba(255,255,255,0.2); transition: 0.4s; cursor: pointer; }
        .bar:hover { fill: var(--wh); }
        .chart-line { stroke: var(--wh); stroke-width: 2; fill: none; stroke-dasharray: 1000; animation: draw 2s ease-in forwards; }
        
        @keyframes draw { to { stroke-dashoffset: 0; } }

        /* Zonas de Entrenamiento */
        .zone-pill { display: inline-block; padding: 4px 10px; border-radius: 4px; font-family: var(--fm); font-size: 10px; margin-right: 5px; }
        .z1 { background: var(--z1); } .z2 { background: var(--z2); } .z4 { background: var(--z4); }
    </style>
</head>
<body>

<header id="hdr">
    <!-- Logo Sergei SVG Restaurado con detalle completo -->
    <svg class="logo-face" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="48" fill="#1c1c1c" stroke="#333" stroke-width="2"/>
        <path d="M20 100 Q25 82 38 78 Q44 76 50 77 Q56 76 62 78 Q75 82 80 100Z" fill="#2a2a2a"/>
        <ellipse cx="50" cy="46" rx="23" ry="25" fill="#2e2e2e"/>
        <path d="M27 43 Q28 21 50 19 Q72 21 73 43" fill="#1a1a1a"/>
        <circle cx="39.5" cy="44" r="2.8" fill="#ffffff"/>
        <circle cx="61.5" cy="44" r="2.8" fill="#ffffff"/>
        <path d="M35 65 Q50 75 65 65" stroke="#666" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="ltw">
        <div class="ln">SERGEI</div>
        <div class="ls">PERFORMANCE ENGINE v2.0</div>
    </div>
</header>

<main id="sergei-app">
    <!-- SECCIÓN 1: DASHBOARD (INICIO) -->
    <section class="page on" id="p-inicio">
        <div class="hero">
            <div>
                <label>CUENTA REGRESIVA</label>
                <div id="display-race-title" style="font-family: var(--fd); font-size: 20px; font-weight: 700; margin-top: 5px;">CARGANDO OBJETIVO...</div>
                <div id="display-race-type" style="font-family: var(--fm); font-size: 11px; color: var(--g4); margin-top: 5px;">PENDIENTE DE CONFIGURACIÓN</div>
            </div>
            <div style="text-align: right;">
                <div class="hero-num" id="days-val">--</div>
                <div style="font-size: 10px; color: var(--g4); font-family: var(--fm); letter-spacing: 1px;">DÍAS RESTANTES</div>
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px;">
            <div class="card">
                <label>PESO ACTUAL</label>
                <div id="dash-weight" style="font-family: var(--fm); font-size: 28px; margin-top: 5px;">--.- <small>kg</small></div>
            </div>
            <div class="card">
                <label>ÚLTIMO RITMO</label>
                <div id="dash-pace" style="font-family: var(--fm); font-size: 28px; margin-top: 5px;">--:--</div>
            </div>
        </div>

        <div class="card">
            <label>ESTADO DE PREPARACIÓN</label>
            <div style="height: 6px; background: var(--g7); border-radius: 3px; margin-top: 15px; overflow: hidden;">
                <div id="prep-progress" style="width: 0%; height: 100%; background: var(--wh); transition: 1s;"></div>
            </div>
        </div>
    </section>

    <!-- SECCIÓN 2: PLANIFICACIÓN (PLAN) -->
    <section class="page" id="p-plan">
        <div class="card">
            <h2 style="font-family: var(--fd); letter-spacing: 2px; margin-bottom: 25px; font-size: 24px;">ESTRATEGIA DE CARRERA</h2>
            
            <div class="input-group">
                <label>Nombre del Evento Principal</label>
                <input type="text" id="in-race-name" placeholder="Ej: Maratón de Chicago">
            </div>
            
            <div class="input-group">
                <label>Fecha de la Competición</label>
                <input type="date" id="in-race-date">
            </div>

            <div class="input-group">
                <label>Distancia Objetivo (KM)</label>
                <select id="in-race-dist">
                    <option value="5">5K - Explosividad</option>
                    <option value="10">10K - Resistencia</option>
                    <option value="21">21K - Media Maratón</option>
                    <option value="42">42K - Maratón</option>
                    <option value="ultra">Ultra Maratón</option>
                </select>
            </div>

            <button class="btn" onclick="sergei.savePlan()">Actualizar Plan Maestro</button>
        </div>

        <div class="card">
            <label>NOTAS DE ENTRENADOR</label>
            <textarea id="coach-notes" rows="4" placeholder="Escribe aquí tus objetivos secundarios o sensaciones generales..."></textarea>
            <button class="btn btn-ghost" style="margin-top: 15px;" onclick="sergei.saveNotes()">Guardar Notas</button>
        </div>
    </section>

    <!-- SECCIÓN 3: BIOMETRÍA (PROGRESO) -->
    <section class="page" id="p-progreso">
        <div class="card">
            <h2 style="font-family: var(--fd); letter-spacing: 2px; margin-bottom: 25px; font-size: 24px;">EVOLUCIÓN FÍSICA</h2>
            
            <div class="input-group">
                <label>Registro de Peso (Kilogramos)</label>
                <input type="number" step="0.1" id="in-weight-log" placeholder="00.0">
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn" onclick="sergei.logWeight()">Registrar</button>
                <button class="btn btn-ghost" onclick="sergei.clearWeights()">Limpiar</button>
            </div>

            <div class="chart-box">
                <svg id="weight-chart" width="100%" height="100%" viewBox="0 0 400 200" preserveAspectRatio="none">
                    <!-- Dinámico -->
                </svg>
            </div>
        </div>

        <div class="card" id="history-list">
            <label>HISTORIAL RECIENTE</label>
            <div id="weight-history-rows" style="margin-top: 15px;">
                <!-- Filas dinámicas -->
            </div>
        </div>
    </section>

    <!-- SECCIÓN 4: LOG ENTRENAMIENTO (ENTRENO) -->
    <section class="page" id="p-entreno">
        <div class="card">
            <h2 style="font-family: var(--fd); letter-spacing: 2px; margin-bottom: 25px; font-size: 24px;">SESIÓN DE HOY</h2>
            
            <div class="input-group">
                <label>Tipo de Entrenamiento</label>
                <select id="run-type-log">
                    <option value="z2">Z2 - Recuperación Activa</option>
                    <option value="z3">Z3 - Ritmo Crucero</option>
                    <option value="z4">Z4 - Umbral Lactato</option>
                    <option value="fuerza">Fuerza / Core</option>
                </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="input-group">
                    <label>KM</label>
                    <input type="number" step="0.1" id="run-km-log" placeholder="0.0">
                </div>
                <div class="input-group">
                    <label>TIEMPO (MIN)</label>
                    <input type="number" id="run-time-log" placeholder="00">
                </div>
            </div>

            <button class="btn" onclick="sergei.logSession()">Sincronizar Sesión</button>
        </div>
    </section>
</main>

<!-- Navegación Inferior -->
<nav id="nav">
    <button class="nb on" id="btn-inicio" onclick="sergei.nav('inicio')"><i>◈</i><span>INICIO</span></button>
    <button class="nb" id="btn-plan" onclick="sergei.nav('plan')"><i>📋</i><span>PLAN</span></button>
    <button class="nb" id="btn-progreso" onclick="sergei.nav('progreso')"><i>📈</i><span>PROGRESO</span></button>
    <button class="nb" id="btn-entreno" onclick="sergei.nav('entreno')"><i>👟</i><span>ENTRENO</span></button>
</nav>

<!-- MOTOR SERGEI v2.0 - CORE LOGIC (EXTENDIDO) -->
<script>
/** 
 * SERGEI ENGINE v2.0 
 * Gestión centralizada de estado, persistencia y renderizado.
 */
const sergei = {
    // --- ESTADO INICIAL ---
    db: {
        profile: JSON.parse(localStorage.getItem('sergei_profile')) || {
            raceName: 'Objetivo no definido',
            raceDate: '',
            raceDist: '42',
            notes: ''
        },
        weights: JSON.parse(localStorage.getItem('sergei_weights')) || [],
        sessions: JSON.parse(localStorage.getItem('sergei_sessions')) || []
    },

    // --- INICIALIZACIÓN ---
    init() {
        console.log("SERGEI v2.0 Engine Starting...");
        this.updateDashboard();
        this.renderHistory();
        this.checkNotifications();
    },

    // --- NAVEGACIÓN ---
    nav(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
        document.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
        
        const target = document.getElementById('p-' + pageId);
        const btn = document.getElementById('btn-' + pageId);
        
        if(target && btn) {
            target.classList.add('on');
            btn.classList.add('on');
            window.scrollTo(0, 0);
            
            // Refrescar gráficos si entra en progreso
            if(pageId === 'progreso') setTimeout(() => this.drawChart(), 100);
        }
    },

    // --- LÓGICA DE PLANIFICACIÓN ---
    savePlan() {
        const name = document.getElementById('in-race-name').value;
        const date = document.getElementById('in-race-date').value;
        const dist = document.getElementById('in-race-dist').value;
        
        if(!name || !date) {
            this.notify("Faltan datos críticos", "error");
            return;
        }

        this.db.profile.raceName = name;
        this.db.profile.raceDate = date;
        this.db.profile.raceDist = dist;
        
        localStorage.setItem('sergei_profile', JSON.stringify(this.db.profile));
        this.updateDashboard();
        this.notify("Plan actualizado", "success");
        this.nav('inicio');
    },

    saveNotes() {
        this.db.profile.notes = document.getElementById('coach-notes').value;
        localStorage.setItem('sergei_profile', JSON.stringify(this.db.profile));
        this.notify("Notas guardadas");
    },

    // --- LÓGICA BIOMÉTRICA ---
    logWeight() {
        const val = parseFloat(document.getElementById('in-weight-log').value);
        if(!val || val < 30 || val > 250) {
            this.notify("Peso fuera de rango", "error");
            return;
        }

        const entry = {
            id: Date.now(),
            date: new Date().toLocaleDateString(),
            val: val
        };

        this.db.weights.push(entry);
        localStorage.setItem('sergei_weights', JSON.stringify(this.db.weights));
        
        document.getElementById('in-weight-log').value = '';
        this.updateDashboard();
        this.renderHistory();
        this.drawChart();
        this.notify("Peso registrado con éxito");
    },

    clearWeights() {
        if(confirm("¿Eliminar todo el historial de peso?")) {
            this.db.weights = [];
            localStorage.removeItem('sergei_weights');
            this.updateDashboard();
            this.renderHistory();
            this.drawChart();
        }
    },

    // --- RENDERIZADO DE DASHBOARD ---
    updateDashboard() {
        // 1. Cuenta atrás
        if(this.db.profile.raceDate) {
            const target = new Date(this.db.profile.raceDate + "T00:00:00");
            const now = new Date();
            now.setHours(0,0,0,0);
            const diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
            
            document.getElementById('days-val').innerText = diff > 0 ? diff : "0";
            document.getElementById('display-race-title').innerText = this.db.profile.raceName;
            document.getElementById('display-race-type').innerText = `${this.db.profile.raceDist}K COMPETITION`;
            
            // Barra progreso (ejemplo 16 semanas = 112 días)
            const progress = Math.max(0, Math.min(100, 100 - (diff / 1.12)));
            document.getElementById('prep-progress').style.width = progress + '%';
        }

        // 2. Peso Dashboard
        if(this.db.weights.length > 0) {
            const last = this.db.weights[this.db.weights.length - 1].val;
            document.getElementById('dash-weight').innerHTML = `${last} <small style="font-size: 14px; color: var(--g4);">kg</small>`;
        }

        // 3. Notas
        document.getElementById('coach-notes').value = this.db.profile.notes;
    },

    renderHistory() {
        const container = document.getElementById('weight-history-rows');
        container.innerHTML = '';
        
        [...this.db.weights].reverse().slice(0, 5).forEach(w => {
            const row = document.createElement('div');
            row.style.cssText = "display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--g7); font-family: var(--fm); font-size: 13px;";
            row.innerHTML = `<span>${w.date}</span><span style="color: var(--wh)">${w.val} kg</span>`;
            container.appendChild(row);
        });
    },

    // --- MOTOR DE GRÁFICOS (CUSTOM SVG ENGINE) ---
    drawChart() {
        const svg = document.getElementById('weight-chart');
        svg.innerHTML = '';
        const data = this.db.weights.slice(-10);
        
        if(data.length < 2) return;

        const max = Math.max(...data.map(d => d.val)) + 1;
        const min = Math.min(...data.map(d => d.val)) - 1;
        const range = max - min;
        
        const points = data.map((d, i) => {
            const x = (i * (400 / (data.length - 1)));
            const y = 200 - ((d.val - min) / range * 160 + 20);
            return {x, y};
        });

        // Crear polilínea
        let dPath = `M ${points[0].x} ${points[0].y}`;
        points.forEach((p, i) => { if(i > 0) dPath += ` L ${p.x} ${p.y}`; });

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", dPath);
        path.setAttribute("class", "chart-line");
        svg.appendChild(path);

        // Crear puntos
        points.forEach(p => {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", p.x);
            circle.setAttribute("cy", p.y);
            circle.setAttribute("r", "4");
            circle.setAttribute("fill", "var(--wh)");
            svg.appendChild(circle);
        });
    },

    // --- LOG DE ENTRENAMIENTO ---
    logSession() {
        const type = document.getElementById('run-type-log').value;
        const km = document.getElementById('run-km-log').value;
        const time = document.getElementById('run-time-log').value;

        if(!km || !time) return this.notify("Completa la sesión", "error");

        const session = { type, km, time, date: new Date() };
        this.db.sessions.push(session);
        localStorage.setItem('sergei_sessions', JSON.stringify(this.db.sessions));
        
        this.notify("Sesión sincronizada");
        this.nav('inicio');
    },

    // --- UTILIDADES ---
    notify(msg, type = "info") {
        console.log(`[SERGEI ${type.toUpperCase()}]: ${msg}`);
        // Aquí iría el sistema de toast si fuera necesario
        alert(msg);
    },

    checkNotifications() {
        // Lógica de recordatorio de peso cada 7 días
    }
};

// --- BOOTSTRAP ---
window.onload = () => sergei.init();

</script>
</body>
</html>
